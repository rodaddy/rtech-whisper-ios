# project.yml is the source of truth for the Xcode project. The generated
# RtechWhisper.xcodeproj is gitignored; run scripts/bootstrap.sh to recreate it.
name: RtechWhisper

options:
  bundleIdPrefix: com.rtech-consulting
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

packages:
  RtechWhisperKit:
    path: Packages/RtechWhisperKit

targets:
  RtechWhisper:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - App
      # Start/StopDictationIntent: the app runs them, the widget extension shows them.
      - Shared/Intents
      # The Live Activity attributes: the app starts it, the extension draws it.
      - Shared/LiveActivity
    dependencies:
      - package: RtechWhisperKit
        product: RtechWhisperKit
      - target: RtechWhisperWidgets
        embed: true
      - target: RtechWhisperKeyboard
        embed: true
    # Shared with the keyboard: it hands the transcript back through here.
    entitlements:
      path: App/RtechWhisper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rtech-consulting.whisper
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: rTech Whisper
        CFBundleName: RtechWhisper
        # The keyboard's mic key opens rtechwhisper://keyboard-dictate.
        CFBundleURLTypes:
          - CFBundleURLName: com.rtech-consulting.whisper
            CFBundleURLSchemes:
              - rtechwhisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: rTech Whisper uses the microphone to record your dictation.
        NSSpeechRecognitionUsageDescription: rTech Whisper uses speech recognition to turn your dictation into text.
        # The Dynamic Island / Lock Screen view of a take in progress.
        NSSupportsLiveActivities: true
        # The sync hub this build talks to; set RTW_HUB_BASE_URL below or on
        # the xcodebuild command line. Empty means hub features stay offline.
        RTWHubBaseURL: $(RTW_HUB_BASE_URL)
        # Keeps the microphone recording when the person leaves the app, so
        # the Live Activity's Stop over another app ends a take that is still
        # running instead of one iOS silently cut off.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtech-consulting.whisper
        PRODUCT_NAME: RtechWhisper
        RTW_HUB_BASE_URL: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Your Apple Developer team ID (Xcode > Settings > Accounts).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # The Control Center control. WidgetKit only; it does not link the kit.
  RtechWhisperWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Widgets
      - Shared/Intents
      - Shared/LiveActivity
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: rTech Whisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtech-consulting.whisper.widgets
        PRODUCT_NAME: RtechWhisperWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Your Apple Developer team ID (Xcode > Settings > Accounts).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # The system-wide keyboard. It cannot record, so its mic key opens the app;
  # the text comes back through the App Group.
  RtechWhisperKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Keyboard
    dependencies:
      - package: RtechWhisperKit
        product: RtechWhisperKit
    entitlements:
      path: Keyboard/RtechWhisperKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rtech-consulting.whisper
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: rTech Whisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Full Access: the App Group and opening the app both need it.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtech-consulting.whisper.keyboard
        PRODUCT_NAME: RtechWhisperKeyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Your Apple Developer team ID (Xcode > Settings > Accounts).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  RtechWhisper:
    build:
      targets:
        RtechWhisper: all
    run:
      config: Debug
    archive:
      config: Release
